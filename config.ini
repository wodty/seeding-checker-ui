[general]
# NAS 下载目录（逗号分隔多个），必须是本程序能直接访问的真实路径
nas_directories = /volume1/downloads
# 排除目录（可选，逗号分隔）
exclude_directories =
# 最小文件大小 MB（0=全部）
size_threshold = 0
# 忽略软链接/硬链接（做种目录使用硬链接时建议改为 false）
ignore_links = true
# 回收目录（「移回收站」时使用，相对路径=程序目录下 trash/）
trash_dir = ./trash

[qb]
# qBittorrent 地址（不带 http://）
host = 192.168.1.100
port = 8080
username = admin
password = change_me
# 路径映射：下载器容器内路径=NAS真实路径（逗号分隔），如 /downloads=/volume1/downloads
path_mappings =
# qB 的 BT_backup 目录（可选，用于清理 .torrent 备份）
torrent_backup_dir =
